<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{brand}} | إدارة العملاء</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#16243a;font-family:Tahoma,Arial,sans-serif;font-size:14px}a{color:#146c75;text-decoration:none}header{background:#10283f;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}header a{color:#fff}.brand{font-size:25px;font-weight:bold}.muted{color:#738298;font-size:13px;line-height:1.8}.wrap{max-width:1450px;margin:auto;padding:25px}.panel{background:white;border:1px solid #e1e8ee;border-radius:17px;padding:22px;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.metric{font-size:32px;font-weight:bold;margin-top:12px}.accent{border-top:4px solid #1e9490}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}input,select,textarea{font:inherit;padding:12px;border:1px solid #cbd6e0;border-radius:9px;background:#fff;color:#16243a}label{display:block;font-size:12px;color:#65758a;margin-bottom:6px}button,.button{display:inline-block;background:#167f83;color:white;border:0;border-radius:9px;padding:11px 17px;cursor:pointer;font:inherit}.secondary{background:#e9eff5;color:#183048}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:15px 11px;border-bottom:1px solid #edf1f5;text-align:right}th{font-size:12px;color:#738298;background:#f8fafc}.badge{display:inline-block;border-radius:20px;background:#e8f4f1;color:#177c70;padding:6px 10px;font-size:12px}.incomplete{background:#fff4df;color:#a56a05}.notice{background:#e5f5ef;padding:15px;border-radius:10px;margin-bottom:16px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1f5;gap:12px}.history{border-right:3px solid #dcebe9;padding:12px 18px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:24px}h2{font-size:18px;margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:440px;margin:9vh auto}.full{width:100%}.pagination{display:flex;justify-content:center;align-items:center;gap:14px;padding:20px}.ltr{direction:ltr;text-align:right}.warning{background:#fff3d9;color:#875b00}.plain{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.wrap{padding:15px}header{padding:20px}.brand{font-size:20px}}
</style></head><body><header><div><a class="brand" href="{{url_for('dashboard')}}">◈ {{brand}}</a><div style="color:#a9bdcf;margin-top:6px">مركز العملاء · تسجيل التجارب ومتابعة التواصل</div></div>{% if session.get('admin') %}<form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf" value="{{csrf()}}"><button class="secondary">خروج</button></form>{% endif %}</header><main class="wrap">{% for msg in get_flashed_messages() %}<div class="notice">{{msg}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
